# HireHub Application Configuration
spring.application.name=hirehub-backend
server.port=8080

# Database Configuration (MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hirehub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
hirehub.upload.dir=./uploads

# JWT Configuration
hirehub.jwt.secret=${JWT_SECRET:hirehubSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHS256Algorithm2026Secure}
hirehub.jwt.expiration-ms=86400000
hirehub.jwt.refresh-expiration-ms=604800000

# AI Configuration (Gemini API / LLM Provider)
# Set GEMINI_API_KEY environment variable or leave blank for intelligent semantic fallback
hirehub.ai.gemini.api-key=${GEMINI_API_KEY:}
hirehub.ai.gemini.model=gemini-1.5-flash
hirehub.ai.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
